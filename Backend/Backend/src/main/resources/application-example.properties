
spring.application.name=${APP_NAME:Backend}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

jwt.secret=${JWT_SECRET}

github.app.id=${GITHUB_APP_ID}
github.app.private-key-path=${GITHUB_PRIVATE_KEY_PATH}
github.app.client-id=${GITHUB_CLIENT_ID}

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen2.5-coder:3b}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.2}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}

server.port=${SERVER_PORT:8081}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
agent.repository.base-path=${AGENT_REPOSITORY_BASE_PATH}

spring.ai.vectorstore.pgvector.initialize-schema=${PGVECTOR_INITIALIZE_SCHEMA:false}
spring.ai.vectorstore.pgvector.index-type=${PGVECTOR_INDEX_TYPE:HNSW}
spring.ai.vectorstore.pgvector.distance-type=${PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
spring.ai.vectorstore.pgvector.dimensions=${PGVECTOR_DIMENSIONS:768}
